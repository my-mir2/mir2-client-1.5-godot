; ====================================================================
; 盛大热血传奇 1.5 官方原版生产就绪主服务端运行配置 (Server Configuration)
; ====================================================================

[Network]
; 客户端 TCP 网关监听端口 (官方默认为 7000)
GatewayPort=7000

; 最大并发在线连接数 (防句柄耗尽)
MaxConnections=3000

; 单会话每秒最大发包数 (防高频发包外挂，超过丢弃，持续超频踢出)
MaxPacketsPerSecond=80

; 空闲连接超时断开时间 (毫秒, 默认 180000 即 3 分钟)
IdleTimeoutMs=180000

; 单连接最大接收缓冲区 (字节, 默认 65536 即 64KB, 防恶意流 OOM)
MaxBufferSize=65536

[Database]
; PostgreSQL 16 工业级数据库物理连接串
ConnectionString=Host=127.0.0.1;Port=5432;Database=mir2_world;Username=postgres;Password=postgres

; 是否开启强制 PostgreSQL 校验 (1=强制，连接失败立即 Fail-Fast 报警退出)
StrictPgMode=1

[WebAdmin]
; 嵌入式管理员运维面板端口
AdminPort=8080

; 管理员访问密钥
AdminSecret=mir2_admin_secret_2026

[Logging]
; 日志存放目录
LogDirectory=logs

; 单个日志文件最大大小 (MB)
MaxLogFileSizeMb=50

; 日志历史保留天数 (天)
LogRetentionDays=30

; 是否启用数据库审计日志 (1=启用写入 PostgreSQL server_audit_logs 表)
EnableDatabaseLogging=1

; 活跃日志表留存天数 (超过此天数的日志将自动原子转移至归档表 server_audit_logs_archive)
LogArchiveRetentionDays=30

; 归档日志表冷备深度留存天数 (超过此天数的历史归档日志自动清理)
LogDeepPurgeDays=180

